<!DOCTYPE html>
<html lang="ja">
<head>
  <title>数当てゲーム</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" >
  <style>
    :root {
      --primary: #F5A200;
      --primary-hover: #d48e00;
      --primary-light: #fff4e0;
    }

    body {
      background-color: var(--primary-light);
      color: #3a2a00;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    main {
      text-align: center;
    }

    h1 {
      color: var(--primary);
    }

    #guessGame {
      margin: 20px 0;
    }

    #cards {
      display: grid;
      grid-template-columns: repeat(10, 56px);
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .card {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 2px solid var(--primary);
      border-radius: 50%;
      font-size: 1.3em;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }

    .card:hover {
      background: var(--primary-light);
      transform: scale(1.08);
    }

    .card.selected {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary-hover);
    }

    #guessSubmit {
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
    }

    #guessSubmit:hover {
      background-color: var(--primary-hover);
    }

    #guessSubmit:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #guessResult {
      font-size: 1.2em;
      font-weight: bold;
      color: var(--primary);
      margin-top: 12px;
    }

    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>
<main class="container">
  <h1>数当てゲーム (1~20)</h1>

  <div id="guessGame">
    <div id="cards"></div>
    <input type="submit" value="予想を入力" id="guessSubmit" disabled>
    <p id="guessResult"></p>
  </div>
</main>

<script>
  let answerNumber = Math.floor(Math.random() * 20) + 1;
  console.log('正解は' + answerNumber);

  let selectedNumber = null;

  const cardsContainer = document.querySelector('#cards');
  for (let i = 1; i <= 20; i++) {
    const card = document.createElement('div');
    card.classList.add('card');
    card.textContent = i;
    card.addEventListener('click', () => {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedNumber = i;
      guessSubmit.disabled = false;
    });
    cardsContainer.appendChild(card);
  }

  let guessSubmit = document.querySelector('#guessSubmit');
  let guessResult = document.querySelector('#guessResult');

  function checkGuess() {
    if (selectedNumber === null) return;

    if (selectedNumber === answerNumber) {
      guessResult.textContent = '正解です！';
      launchConfetti();
    } else if (selectedNumber < answerNumber) {
      guessResult.textContent = 'もっと大きいです';
    } else {
      guessResult.textContent = 'もっと小さいです';
    }
  }

  // コンフェティアニメーション
  const canvas = document.querySelector('#confettiCanvas');
  const ctx = canvas.getContext('2d');
  let confettiPieces = [];
  let animationId = null;

  const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81', '#eccc68', '#a29bfe', '#fd79a8'];

  function launchConfetti() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    confettiPieces = [];

    for (let i = 0; i < 150; i++) {
      confettiPieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        w: Math.random() * 10 + 5,
        h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: Math.random() * 4 + 2,
        angle: Math.random() * 360,
        spin: Math.random() * 4 - 2,
        drift: Math.random() * 2 - 1,
      });
    }

    if (animationId) cancelAnimationFrame(animationId);
    animateConfetti();
  }

  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiPieces.forEach(p => {
      p.y += p.speed;
      p.x += p.drift;
      p.angle += p.spin;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });

    confettiPieces = confettiPieces.filter(p => p.y < canvas.height);
    if (confettiPieces.length > 0) {
      animationId = requestAnimationFrame(animateConfetti);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  guessSubmit.addEventListener('click', checkGuess);
</script>

</body>
</html>
