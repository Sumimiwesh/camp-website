<!DOCTYPE html>
<html lang="ja">
<head>
  <title>Today's Pokemon</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Press Start 2P', monospace;
      box-sizing: border-box;
    }

    body {
      background-color: #1a0a2e;
      background-image:
        radial-gradient(circle, #2a1a3e 1px, transparent 1px);
      background-size: 24px 24px;
      color: #f0e8d0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #0d0d1a;
      border: 4px solid #F5A200;
      box-shadow: 6px 6px 0px #7a5100, 0 0 24px #F5A20044;
      padding: 32px 28px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #F5A200;
      font-size: 0.85em;
      margin: 0 0 8px;
      line-height: 2;
      text-shadow: 3px 3px 0px #7a5100;
      letter-spacing: 2px;
    }

    .stars {
      color: #F5A200;
      font-size: 0.6em;
      letter-spacing: 6px;
      margin-bottom: 12px;
    }

    .date-display {
      font-size: 0.35em;
      color: #888;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .pixel-divider {
      border: none;
      border-top: 4px solid #F5A200;
      margin: 16px 0;
      box-shadow: 0 2px 0px #7a5100;
    }

    .pokemon-sprite {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 160px;
      height: 160px;
      margin: 8px auto 4px;
      display: block;
      filter: drop-shadow(4px 4px 0px #F5A20066);
    }

    .pokemon-number {
      font-size: 0.35em;
      color: #888;
      margin-bottom: 4px;
    }

    .pokemon-name {
      color: #F5A200;
      font-size: 1em;
      margin: 8px 0 12px;
      text-shadow: 2px 2px 0px #7a5100;
    }

    .pokemon-types {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 8px 0 16px;
    }

    .type-badge {
      font-size: 0.3em;
      padding: 5px 10px;
      border: 2px solid #F5A200;
      color: #F5A200;
      background: #1a0a2e;
      box-shadow: 2px 2px 0px #7a5100;
    }

    .pokemon-description {
      font-size: 0.32em;
      line-height: 2.5;
      color: #d0c8b0;
      border: 3px solid #333;
      padding: 14px;
      margin-top: 12px;
      text-align: left;
      background: #0a0a14;
      box-shadow: inset 2px 2px 0px #000;
    }

    .loading {
      font-size: 0.45em;
      color: #F5A200;
      animation: blink 1s step-end infinite;
      margin: 32px 0;
    }

    .error {
      font-size: 0.35em;
      color: #ff6b6b;
      line-height: 2.5;
      margin: 24px 0;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="stars">★ ★ ★</div>
    <h1>TODAY'S<br>POKEMON</h1>
    <div class="date-display" id="dateDisplay"></div>
    <hr class="pixel-divider">
    <div id="pokemonContent">
      <p class="loading">NOW LOADING...</p>
    </div>
  </div>

  <script>
    const typeNames = {
      normal: 'ノーマル', fire: 'ほのお', water: 'みず', electric: 'でんき',
      grass: 'くさ', ice: 'こおり', fighting: 'かくとう', poison: 'どく',
      ground: 'じめん', flying: 'ひこう', psychic: 'エスパー', bug: 'むし',
      rock: 'いわ', ghost: 'ゴースト', dragon: 'ドラゴン', dark: 'あく',
      steel: 'はがね', fairy: 'フェアリー'
    };

    const today = new Date();
    const dateDisplay = document.querySelector('#dateDisplay');
    dateDisplay.textContent =
      today.getFullYear() + '.' +
      String(today.getMonth() + 1).padStart(2, '0') + '.' +
      String(today.getDate()).padStart(2, '0');

    const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
    const pokemonId = (dayOfYear % 151) + 1;

    async function fetchPokemon() {
      try {
        const [pokeRes, speciesRes] = await Promise.all([
          fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`),
          fetch(`https://pokeapi.co/api/v2/pokemon-species/${pokemonId}`)
        ]);
        const data = await pokeRes.json();
        const speciesData = await speciesRes.json();

        const jaName =
          speciesData.names.find(n => n.language.name === 'ja-Hrkt') ||
          speciesData.names.find(n => n.language.name === 'ja');
        const name = jaName ? jaName.name : data.name.toUpperCase();

        const jaFlavor = speciesData.flavor_text_entries
          .filter(e => e.language.name === 'ja')
          .pop();
        const description = jaFlavor
          ? jaFlavor.flavor_text.replace(/\f|\n/g, ' ')
          : '説明文がありません。';

        const types = data.types.map(t => typeNames[t.type.name] || t.type.name);
        const sprite = data.sprites.front_default;

        document.querySelector('#pokemonContent').innerHTML = `
          <img class="pokemon-sprite" src="${sprite}" alt="${name}">
          <p class="pokemon-number">No. ${String(pokemonId).padStart(3, '0')}</p>
          <p class="pokemon-name">${name}</p>
          <div class="pokemon-types">
            ${types.map(t => `<span class="type-badge">${t}</span>`).join('')}
          </div>
          <div class="pokemon-description">${description}</div>
        `;
      } catch (e) {
        document.querySelector('#pokemonContent').innerHTML =
          '<p class="error">ERROR...<br><br>データを<br>よみこめませんでした</p>';
      }
    }

    fetchPokemon();
  </script>
</body>
</html>
